name: Build Ndvideo

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Ndless dependency
        id: ndless-source
        run: |
          if [ ! -d external/Ndless-official/.git ]; then
            rm -rf external/Ndless-official
            git clone --branch master --recurse-submodules https://github.com/ndless-nspire/Ndless.git external/Ndless-official
          fi
          git -C external/Ndless-official fetch --tags origin master
          git -C external/Ndless-official checkout master
          git -C external/Ndless-official reset --hard origin/master
          git -C external/Ndless-official submodule sync --recursive
          git -C external/Ndless-official submodule update --init --recursive
          echo "sha=$(git -C external/Ndless-official rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libboost-program-options-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtinfo-dev \
            python3-dev \
            texinfo \
            xz-utils \
            zlib1g-dev

      - name: Cache Ndless ARM toolchain
        uses: actions/cache@v4
        id: ndless-toolchain-cache
        with:
          path: external/Ndless-official/ndless-sdk/toolchain/install
          key: ${{ runner.os }}-ndless-toolchain-${{ steps.ndless-source.outputs.sha }}-${{ hashFiles('external/Ndless-official/ndless-sdk/toolchain/build_toolchain.sh') }}

      - name: Build Ndless ARM toolchain
        if: steps.ndless-toolchain-cache.outputs.cache-hit != 'true'
        working-directory: external/Ndless-official/ndless-sdk/toolchain
        run: PARALLEL="-j$(nproc)" ./build_toolchain.sh

      - name: Add Ndless toolchain to PATH
        run: |
          echo "$GITHUB_WORKSPACE/external/Ndless-official/ndless-sdk/toolchain/install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/external/Ndless-official/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build Ndless SDK libraries
        working-directory: external/Ndless-official/ndless-sdk
        run: |
          make build-libsyscalls
          make build-libndls
          make build-thirdparty

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyelftools

      - name: Build ndvideo
        run: make SDKROOT=./external/Ndless-official/ndless-sdk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ndvideo-${{ github.sha }}
          path: |
            dist/ndvideo.tns
            dist/ndvideo.zehn
            dist/ndvideo.elf
          if-no-files-found: error

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          release_name="${GITHUB_REF_NAME//\//-}"
          mkdir -p release
          cp dist/ndvideo.tns "release/ndvideo-${release_name}.tns"
          cp dist/ndvideo.zehn "release/ndvideo-${release_name}.zehn"
          cp dist/ndvideo.elf "release/ndvideo-${release_name}.elf"
          (
            cd release
            sha256sum "ndvideo-${release_name}.tns" "ndvideo-${release_name}.zehn" "ndvideo-${release_name}.elf" > SHA256SUMS.txt
          )
          {
            echo "ND Video Player ${GITHUB_REF_NAME}"
            echo
            echo "Built from commit ${GITHUB_SHA}."
            echo
            echo "## Assets"
            echo "- \`ndvideo-${release_name}.tns\` - calculator-ready app"
            echo "- \`ndvideo-${release_name}.zehn\` - packed Zehn payload"
            echo "- \`ndvideo-${release_name}.elf\` - debug/symbol build artifact"
            echo "- \`SHA256SUMS.txt\` - SHA-256 checksums"
          } > release/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release -maxdepth 1 -type f ! -name RELEASE_NOTES.md | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "ND Video Player ${GITHUB_REF_NAME}" \
              --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "ND Video Player ${GITHUB_REF_NAME}" \
              --notes-file release/RELEASE_NOTES.md
          fi
