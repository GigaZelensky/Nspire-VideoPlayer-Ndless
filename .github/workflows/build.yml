name: Build Ndvideo

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish release assets for
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Fetch Ndless dependency
        id: ndless-source
        run: |
          if [ ! -d external/Ndless-official/.git ]; then
            rm -rf external/Ndless-official
            git clone --branch master --recurse-submodules https://github.com/ndless-nspire/Ndless.git external/Ndless-official
          fi
          git -C external/Ndless-official fetch --tags origin master
          git -C external/Ndless-official checkout master
          git -C external/Ndless-official reset --hard origin/master
          git -C external/Ndless-official submodule sync --recursive
          git -C external/Ndless-official submodule update --init --recursive
          echo "sha=$(git -C external/Ndless-official rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libboost-program-options-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtinfo-dev \
            python3-dev \
            texinfo \
            xz-utils \
            zlib1g-dev

      - name: Cache Ndless ARM toolchain
        uses: actions/cache@v5
        id: ndless-toolchain-cache
        with:
          path: external/Ndless-official/ndless-sdk/toolchain/install
          key: ${{ runner.os }}-ndless-toolchain-${{ steps.ndless-source.outputs.sha }}-${{ hashFiles('external/Ndless-official/ndless-sdk/toolchain/build_toolchain.sh') }}

      - name: Build Ndless ARM toolchain
        if: steps.ndless-toolchain-cache.outputs.cache-hit != 'true'
        working-directory: external/Ndless-official/ndless-sdk/toolchain
        run: PARALLEL="-j$(nproc)" ./build_toolchain.sh

      - name: Add Ndless toolchain to PATH
        run: |
          echo "$GITHUB_WORKSPACE/external/Ndless-official/ndless-sdk/toolchain/install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/external/Ndless-official/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build Ndless SDK libraries
        working-directory: external/Ndless-official/ndless-sdk
        run: |
          make build-libsyscalls
          make build-libndls
          make build-thirdparty

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyelftools

      - name: Build ndvideo
        run: make SDKROOT=./external/Ndless-official/ndless-sdk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ndvideo-${{ github.sha }}
          path: |
            dist/ndvideo.tns
            dist/ndvideo.zehn
            dist/ndvideo.elf
          if-no-files-found: error

      - name: Resolve release target
        id: release-target
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          tag=""
          rolling=false
          default_branch="${{ github.event.repository.default_branch }}"
          manual_tag="${{ inputs.release_tag }}"

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            publish=true
            tag="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$manual_tag" ]]; then
            publish=true
            tag="$manual_tag"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/${default_branch}" ]]; then
            publish=true
            tag="latest"
            rolling=true
          fi

          {
            echo "publish=${publish}"
            echo "tag=${tag}"
            echo "rolling=${rolling}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        if: steps.release-target.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          RELEASE_ROLLING: ${{ steps.release-target.outputs.rolling }}
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          release_name="${RELEASE_TAG//\//-}"
          mkdir -p release
          cp dist/ndvideo.tns "release/ndvideo-${release_name}.tns"
          cp dist/ndvideo.zehn "release/ndvideo-${release_name}.zehn"
          cp dist/ndvideo.elf "release/ndvideo-${release_name}.elf"
          (
            cd release
            sha256sum "ndvideo-${release_name}.tns" "ndvideo-${release_name}.zehn" "ndvideo-${release_name}.elf" > SHA256SUMS.txt
          )
          {
            echo "ND Video Player ${RELEASE_TAG}"
            echo
            echo "Built from commit ${build_sha}."
            if [ "$RELEASE_ROLLING" = "true" ]; then
              echo
              echo "This is the rolling latest build from the default branch."
            fi
            echo
            echo "## Assets"
            echo "- \`ndvideo-${release_name}.tns\` - calculator-ready app"
            echo "- \`ndvideo-${release_name}.zehn\` - packed Zehn payload"
            echo "- \`ndvideo-${release_name}.elf\` - debug/symbol build artifact"
            echo "- \`SHA256SUMS.txt\` - SHA-256 checksums"
          } > release/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: steps.release-target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          RELEASE_ROLLING: ${{ steps.release-target.outputs.rolling }}
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          mapfile -t assets < <(find release -maxdepth 1 -type f ! -name RELEASE_NOTES.md | sort)
          if [ "$RELEASE_ROLLING" = "true" ]; then
            git tag -f "$RELEASE_TAG" "$build_sha"
            git push origin "refs/tags/$RELEASE_TAG" --force
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [ "$RELEASE_ROLLING" = "true" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "ND Video Player ${RELEASE_TAG}" \
                --notes-file release/RELEASE_NOTES.md \
                --draft=false \
                --prerelease=false
              gh release edit "$RELEASE_TAG" \
                --latest
            else
              gh release edit "$RELEASE_TAG" \
                --title "ND Video Player ${RELEASE_TAG}" \
                --notes-file release/RELEASE_NOTES.md
            fi
          else
            if [ "$RELEASE_ROLLING" = "true" ]; then
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --title "ND Video Player ${RELEASE_TAG}" \
                --notes-file release/RELEASE_NOTES.md \
                --latest \
                --target "$build_sha"
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" \
                --title "ND Video Player ${RELEASE_TAG}" \
                --notes-file release/RELEASE_NOTES.md
            fi
          fi
